<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ahmad Jazil Faiz — IT Developer</title>
  <meta name="description" content="Portofolio Ahmad Jazil Faiz, IT Developer lulusan Informatika Universitas Gunadarma." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Ahmad Jazil Faiz — IT Developer" />
  <meta property="og:description" content="Portofolio Ahmad Jazil Faiz, IT Developer lulusan Informatika Universitas Gunadarma." />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <script>
    // Terapkan tema sebelum halaman dirender agar tidak berkedip
    (function () {
      var t;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    })();
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Kumpulan ikon SVG -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2Z"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></symbol>
    <symbol id="i-linkedin" viewBox="0 0 24 24"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6Z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></symbol>
    <symbol id="i-github" viewBox="0 0 24 24"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.1-1.2-.3-2.4-1-3.5.3-1.2.3-2.4 0-3.5 0 0-1 0-3 1.5a10.4 10.4 0 0 0-6 0C8 2 7 2 7 2c-.3 1.1-.3 2.3 0 3.5A5.4 5.4 0 0 0 6 9c0 3.5 3 5.5 6 5.5-.4.5-.7 1-.8 1.7-.2.6-.3 1.2-.2 1.8v4"/><path d="M9 18c-4.5 2-5-2-7-2"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.7 9a1 1 0 0 1-.6 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.2-2.7a1.2 1.2 0 0 1 1.6 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1Z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-6"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2 2h3l2.7 12.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></symbol>
    <symbol id="i-network" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="16" y="16" width="6" height="6" rx="1"/><path d="M5 16v-3h14v3M12 8v5"/></symbol>
    <symbol id="i-award" viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="M15.5 12.9 17 22l-5-3-5 3 1.5-9.1"/></symbol>
    <symbol id="i-cap" viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></symbol>
    <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></symbol>
    <symbol id="i-mobile" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></symbol>
    <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></symbol>
  </svg>

  <header class="nav">
    <div class="container nav-inner">
      <a href="#hero" class="logo"><span class="logo-mark"><svg class="icon"><use href="#i-code"/></svg></span>Portofolio</a>
      <nav class="nav-links">
        <a href="#tentang">Tentang</a>
        <a href="#pengalaman">Pengalaman</a>
        <a href="#proyek">Proyek</a>
        <a href="#skills">Keahlian</a>
        <a href="#pendidikan">Pendidikan</a>
        <a href="#kontak">Kontak</a>
      </nav>
      <div class="nav-actions">
        <button class="icon-btn theme-toggle" aria-label="Ganti tema terang/gelap" title="Ganti tema">
          <svg class="icon icon-sun"><use href="#i-sun"/></svg>
          <svg class="icon icon-moon"><use href="#i-moon"/></svg>
        </button>
        <a href="#" class="btn btn-sm nav-cv" data-bind="cv" download>Unduh CV</a>
        <button class="icon-btn nav-toggle" aria-label="Buka menu"><svg class="icon"><use href="#i-menu"/></svg></button>
      </div>
    </div>
  </header>

  <!-- Seluruh konten diisi oleh js/script.js dari data/content.json.
       Edit konten lewat halaman /admin, bukan di file ini. -->
  <main>
    <section id="hero" class="hero">
      <div class="container hero-inner">
        <div class="hero-text">
          <span class="badge" data-bind="status" hidden><span class="dot"></span><span data-bind="statusText"></span></span>
          <h1 data-bind="nama"></h1>
          <p class="hero-role" data-bind="peran"></p>
          <p class="lead" data-bind="ringkasan"></p>
          <div class="hero-cta">
            <a href="#proyek" class="btn">Lihat Proyek</a>
            <a href="#" class="btn btn-outline" data-bind="cv" download><svg class="icon"><use href="#i-download"/></svg>Unduh CV</a>
          </div>
          <div class="hero-social" data-list="heroSocial"></div>
        </div>
        <div class="hero-photo">
          <div class="photo-frame"><img data-bind="foto" alt="" /></div>
        </div>
      </div>
      <div class="container"><div class="stats" data-list="statistik"></div></div>
    </section>

    <section id="tentang" class="section">
      <div class="container about-grid">
        <div>
          <p class="eyebrow">Tentang Saya</p>
          <h2 class="section-title" data-bind="tentangJudul"></h2>
        </div>
        <div class="about-text" data-list="tentang"></div>
      </div>
    </section>

    <section id="pengalaman" class="section section-alt">
      <div class="container">
        <p class="eyebrow">Pengalaman</p>
        <h2 class="section-title">Riwayat Pengalaman</h2>
        <div class="timeline" data-list="pengalaman"></div>
      </div>
    </section>

    <section id="proyek" class="section">
      <div class="container">
        <p class="eyebrow">Portofolio</p>
        <h2 class="section-title">Proyek Unggulan</h2>
        <div class="projects" data-list="proyek"></div>
      </div>
    </section>

    <section id="skills" class="section section-alt">
      <div class="container">
        <p class="eyebrow">Keahlian</p>
        <h2 class="section-title">Teknologi &amp; Kompetensi</h2>
        <div class="skills-grid" data-list="keahlian"></div>
      </div>
    </section>

    <section id="pendidikan" class="section">
      <div class="container">
        <p class="eyebrow">Pendidikan &amp; Sertifikasi</p>
        <h2 class="section-title">Latar Belakang Akademik</h2>
        <div class="edu-grid">
          <div class="edu-list" data-list="pendidikan"></div>
          <div class="certs reveal">
            <div class="certs-head"><span class="project-icon"><svg class="icon"><use href="#i-award"/></svg></span><h3>Sertifikasi</h3></div>
            <div data-list="sertifikasi"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="kontak" class="section contact">
      <div class="container">
        <div class="contact-box">
          <div>
            <p class="eyebrow">Kontak</p>
            <h2 class="section-title" data-bind="kontakJudul"></h2>
            <p class="contact-lead" data-bind="kontakPengantar"></p>
          </div>
          <div class="contact-links" data-list="kontak"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <p>© <span id="year"></span> <span data-bind="nama"></span></p>
      <a href="#hero">Kembali ke atas ↑</a>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
